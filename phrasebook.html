<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12131a">
<!-- All relative: this is served from a subpath (/Eng-Phrases/) on GitHub
     Pages, so anything absolute would resolve off the site. iOS gives
     apple-touch-icon priority over the manifest's icons, and applies its own
     rounded mask, so that PNG is deliberately square and full-bleed. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<title>Phrasebook</title>
<style>
  :root{
    --bg:#12131a; --surface:#1c1e28; --surface2:#252836;
    --line:#31344a; --text:#eef0f7; --muted:#9aa0b8;
    --accent:#7c8cff; --good:#3ecf8e; --warn:#ffb454;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
    display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  header h1{font-size:18px;margin:0;letter-spacing:.3px}
  header span{font-size:13px;color:var(--muted)}
  main{flex:1;overflow-y:auto;padding:18px;-webkit-overflow-scrolling:touch}
  .panel{display:none}
  .panel.on{display:block}

  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 2px}
  input,textarea{
    width:100%;background:var(--surface);border:1px solid var(--line);
    color:var(--text);border-radius:var(--r);padding:13px 14px;
    font:inherit;font-size:16px;outline:none;resize:vertical;
  }
  input:focus,textarea:focus{border-color:var(--accent)}
  .field{margin-bottom:16px}
  .hint{font-size:12px;color:var(--muted);margin:6px 2px 0}

  button{font:inherit;cursor:pointer;border:none;border-radius:var(--r)}
  .btn{
    width:100%;padding:15px;background:var(--accent);color:#0f1020;
    font-weight:650;font-size:16px;
  }
  .btn:active{opacity:.8}
  .btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
  .row{display:flex;gap:10px}
  .row>*{flex:1}

  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:88px;
    background:var(--good);color:#06210f;padding:10px 18px;border-radius:999px;
    font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:20;
  }
  .toast.on{opacity:1;bottom:96px}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 15px;margin-bottom:10px;
  }
  .card .p{font-weight:650;font-size:17px}
  .card .m{color:#d5d9ec;margin-top:5px}
  .card .s{color:var(--muted);font-size:13px;margin-top:7px;font-style:italic}
  .meta{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}
  .pill{padding:2px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
  .pill.known{color:var(--good);border-color:#28613f}
  .pill.due{color:var(--warn);border-color:#6b4b17}
  .acts{display:flex;gap:8px;margin-top:12px}
  .acts button{flex:1;padding:9px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-size:13px}
  .acts button.del{color:#ff7a7a}

  .empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:15px}
  .empty b{display:block;color:var(--text);font-size:17px;margin-bottom:8px}

  /* review */
  .prog{height:4px;background:var(--surface2);border-radius:9px;overflow:hidden;margin-bottom:18px}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:.3s}
  .flash{
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    min-height:230px;padding:26px 22px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;cursor:pointer;
  }
  .flash .q{font-size:26px;font-weight:650;line-height:1.35}
  .flash .tap{color:var(--muted);font-size:13px;margin-top:18px}
  .flash .a{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);width:100%}
  .flash .a .m{font-size:17px;color:#d9dcef}
  .flash .a .s{font-size:14px;color:var(--muted);font-style:italic;margin-top:12px}
  .grade{display:flex;gap:10px;margin-top:16px}
  .grade button{flex:1;padding:16px;font-weight:600;font-size:15px}
  .grade .no{background:var(--surface2);color:var(--warn);border:1px solid #6b4b17}
  .grade .yes{background:var(--good);color:#06210f}

  nav{
    display:flex;border-top:1px solid var(--line);background:var(--surface);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1;background:none;color:var(--muted);padding:13px 4px 15px;
    font-size:12px;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  nav button.on{color:var(--accent)}
  nav .badge{
    position:absolute;transform:translate(15px,-4px);background:var(--warn);color:#2a1a00;
    font-size:10px;font-weight:700;border-radius:999px;padding:1px 6px;
  }
  .navwrap{position:relative;flex:1;display:flex}
  .sub{color:var(--muted);font-size:13px;margin:-6px 0 16px 2px}
</style>
</head>
<body>

<header>
  <h1>Phrasebook</h1>
  <span id="stat"></span>
</header>

<main>
  <!-- ADD -->
  <section id="p-add" class="panel on">
    <div class="field">
      <label for="f-phrase">Phrase, word or slang</label>
      <input id="f-phrase" autocomplete="off" autocapitalize="none" placeholder="e.g. to bite the bullet">
    </div>
    <div class="field">
      <label for="f-meaning">What it means</label>
      <textarea id="f-meaning" rows="2" placeholder="in your own words"></textarea>
    </div>
    <div class="field">
      <label for="f-source">Where I heard it</label>
      <textarea id="f-source" rows="2" placeholder="e.g. Sam said it on the standup call about the deadline"></textarea>
      <p class="hint">The context is what makes it stick. Even 5 words helps.</p>
    </div>
    <button class="btn" id="save">Save</button>
    <div class="row" id="editrow" style="margin-top:10px;display:none">
      <button class="btn ghost" id="cancel">Cancel edit</button>
    </div>
  </section>

  <!-- WORDS -->
  <section id="p-words" class="panel">
    <div class="field">
      <input id="search" placeholder="Search phrases, meanings, context…" autocomplete="off">
    </div>
    <div id="list"></div>
    <div class="row" style="margin-top:22px">
      <button class="btn ghost" id="export">Back up</button>
      <button class="btn ghost" id="importbtn">Restore</button>
    </div>
    <input type="file" id="importfile" accept=".json" style="display:none">
    <p class="hint" style="text-align:center" id="backup-hint">Everything is stored on this device only.</p>
  </section>

  <!-- REVIEW -->
  <section id="p-review" class="panel">
    <div id="review-body"></div>
  </section>
</main>

<nav>
  <div class="navwrap"><button data-tab="add" class="on">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add</button></div>
  <div class="navwrap"><button data-tab="words">
    <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Words</button></div>
  <div class="navwrap"><button data-tab="review">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 10h8M8 14h5"/></svg>Review<span class="badge" id="badge" style="display:none"></span></button></div>
</nav>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const KEY = "phrasebook.v1";
const $ = s => document.querySelector(s);

/* ---------- storage ---------- */
let items = [];
try { items = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e){ items = []; }
const save = () => localStorage.setItem(KEY, JSON.stringify(items));

/* ---------- dates ---------- */
const dayStr = d => { const x = d ? new Date(d) : new Date();
  return x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0"); };
const today = () => dayStr();
const plusDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return dayStr(d); };
const prettyDate = iso => {
  const t = today();
  if (dayStr(iso) === t) return "today";
  if (dayStr(iso) === plusDays(-1)) return "yesterday";
  return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric"});
};

/* ---------- model ---------- */
const dueNow = () => items.filter(i => i.status !== "known" && i.due <= today());
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), 1500);
}

function refreshChrome(){
  const d = dueNow().length;
  $("#stat").textContent = items.length + (items.length===1?" phrase":" phrases");
  const b = $("#badge");
  if (d){ b.textContent = d; b.style.display = ""; } else b.style.display = "none";
}

/* ---------- tabs ---------- */
let tab = "add";
function go(t){
  tab = t;
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-"+t));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  if (t === "words") renderList();
  if (t === "review") startReview();
  if (t === "add") setTimeout(()=>$("#f-phrase").focus(), 60);
  window.scrollTo(0,0); document.querySelector("main").scrollTop = 0;
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.tab));

/* ---------- add / edit ---------- */
let editingId = null;
$("#save").onclick = () => {
  const phrase = $("#f-phrase").value.trim();
  const meaning = $("#f-meaning").value.trim();
  const source = $("#f-source").value.trim();
  if (!phrase) { $("#f-phrase").focus(); return toast("Add a phrase first"); }

  if (editingId){
    const it = items.find(i => i.id === editingId);
    Object.assign(it, {phrase, meaning, source});
    editingId = null; $("#editrow").style.display = "none"; $("#save").textContent = "Save";
    save(); clearForm(); refreshChrome(); toast("Updated"); go("words"); return;
  }
  items.unshift({
    id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
    phrase, meaning, source,
    created: new Date().toISOString(),
    due: today(), status: "new", seen: 0
  });
  save(); clearForm(); refreshChrome(); toast("Saved");
  $("#f-phrase").focus();
};
function clearForm(){ $("#f-phrase").value = $("#f-meaning").value = $("#f-source").value = ""; }
$("#cancel").onclick = () => {
  editingId = null; clearForm();
  $("#editrow").style.display = "none"; $("#save").textContent = "Save"; go("words");
};
$("#f-phrase").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); $("#f-meaning").focus(); }});

/* ---------- words list ---------- */
let open = null;
function renderList(){
  refreshBackupHint();
  const q = $("#search").value.trim().toLowerCase();
  const rows = items.filter(i => !q ||
    (i.phrase+" "+i.meaning+" "+i.source).toLowerCase().includes(q));

  if (!rows.length){
    $("#list").innerHTML = items.length
      ? `<div class="empty">Nothing matches “${esc(q)}”.</div>`
      : `<div class="empty"><b>No phrases yet</b>Tap Add whenever you hear something new.</div>`;
    return;
  }
  $("#list").innerHTML = rows.map(i => {
    const pill = i.status === "known"
      ? '<span class="pill known">known</span>'
      : (i.due <= today() ? '<span class="pill due">due</span>' : '<span class="pill">' + prettyDate(i.due) + '</span>');
    return `<div class="card" data-id="${i.id}">
      <div class="p">${esc(i.phrase)}</div>
      ${i.meaning ? `<div class="m">${esc(i.meaning)}</div>` : ""}
      ${i.source ? `<div class="s">“${esc(i.source)}”</div>` : ""}
      <div class="meta">${pill}<span>added ${prettyDate(i.created)}</span>${i.seen?`<span>· seen ${i.seen}×</span>`:""}</div>
      ${open===i.id ? `<div class="acts">
          <button data-a="edit">Edit</button>
          <button data-a="reset">Review again</button>
          <button data-a="del" class="del">Delete</button>
        </div>` : ""}
    </div>`;
  }).join("");

  $("#list").querySelectorAll(".card").forEach(el => {
    el.onclick = e => {
      const a = e.target.dataset.a, id = el.dataset.id;
      if (!a){ open = (open === id ? null : id); return renderList(); }
      const it = items.find(x => x.id === id);
      if (a === "edit"){
        editingId = id; $("#f-phrase").value = it.phrase;
        $("#f-meaning").value = it.meaning; $("#f-source").value = it.source;
        $("#save").textContent = "Update"; $("#editrow").style.display = "flex"; go("add");
      } else if (a === "reset"){
        it.status = "learning"; it.due = today(); save(); open = null;
        refreshChrome(); renderList(); toast("Back in tonight's deck");
      } else if (a === "del"){
        if (!confirm("Delete “" + it.phrase + "”?")) return;
        items = items.filter(x => x.id !== id); save(); open = null;
        refreshChrome(); renderList(); toast("Deleted");
      }
    };
  });
}
$("#search").oninput = () => { open = null; renderList(); };

/* ---------- review ---------- */
let deck = [], pos = 0, flipped = false, practiceAll = false;

function startReview(){ deck = shuffle(dueNow()); pos = 0; flipped = false; practiceAll = false; renderReview(); }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function renderReview(){
  const box = $("#review-body");
  if (!items.length){
    box.innerHTML = `<div class="empty"><b>Nothing to review</b>Add a few phrases during the day and they'll show up here tonight.</div>`;
    return;
  }
  if (pos >= deck.length){
    const known = items.filter(i => i.status === "known").length;
    box.innerHTML = `<div class="empty">
        <b>${deck.length ? "Done for tonight" : "Nothing due tonight"}</b>
        ${known} of ${items.length} marked known.
      </div>
      <button class="btn ghost" id="all">Practice all ${items.length} anyway</button>`;
    $("#all").onclick = () => { deck = shuffle(items); pos = 0; flipped = false; practiceAll = true; renderReview(); };
    return;
  }
  const it = deck[pos];
  box.innerHTML = `
    <div class="prog"><i style="width:${(pos/deck.length)*100}%"></i></div>
    <div class="sub">${pos+1} of ${deck.length}${practiceAll?" · practice":""}</div>
    <div class="flash" id="flash">
      <div class="q">${esc(it.phrase)}</div>
      ${flipped ? `<div class="a">
          <div class="m">${esc(it.meaning) || "<span style='color:var(--muted)'>no meaning saved</span>"}</div>
          ${it.source ? `<div class="s">“${esc(it.source)}”</div>` : ""}
        </div>` : `<div class="tap">tap to reveal</div>`}
    </div>
    ${flipped ? `<div class="grade">
        <button class="no" id="g-no">Didn't know</button>
        <button class="yes" id="g-yes">Knew it</button>
      </div>` : ""}`;

  $("#flash").onclick = () => { if (!flipped){ flipped = true; renderReview(); } };
  if (flipped){
    $("#g-no").onclick  = () => grade(false);
    $("#g-yes").onclick = () => grade(true);
  }
}
function grade(knew){
  const it = deck[pos];
  it.seen = (it.seen || 0) + 1;
  if (knew){ it.status = "known"; it.due = plusDays(30); }
  else { it.status = "learning"; it.due = plusDays(1); }
  save(); refreshChrome();
  pos++; flipped = false; renderReview();
}

/* ---------- backup ---------- */
/* Kept under its own key so the phrasebook.v1 array keeps its shape. */
const BKEY = "phrasebook.backup";

/* Day index from a "YYYY-MM-DD" string. Built from the parts rather than
   new Date(s), which would parse as UTC midnight and be a day out here. */
const dayNum = s => { const p = String(s).split("-").map(Number);
  return Date.UTC(p[0], p[1]-1, p[2]) / 86400000; };

function refreshBackupHint(){
  const el = $("#backup-hint"), last = localStorage.getItem(BKEY);
  if (!items.length){ el.textContent = "Everything is stored on this device only."; el.style.color = ""; return; }
  if (!last){
    el.textContent = "Never backed up. Everything is stored on this device only.";
    el.style.color = "var(--warn)"; return;
  }
  const n = dayNum(today()) - dayNum(last);
  el.textContent = n <= 0 ? "Backed up today."
    : n === 1 ? "Last backed up yesterday."
    : "Last backed up " + n + " days ago.";
  el.style.color = n >= 14 ? "var(--warn)" : "";
}

$("#export").onclick = () => {
  const blob = new Blob([JSON.stringify(items,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "phrasebook-" + today() + ".json";
  a.click(); URL.revokeObjectURL(a.href);
  localStorage.setItem(BKEY, today()); refreshBackupHint(); toast("Backed up");
};
$("#importbtn").onclick = () => $("#importfile").click();
$("#importfile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data)) throw 0;
      const have = new Set(items.map(i => i.id));
      let n = 0;
      data.forEach(d => { if (d && d.phrase && !have.has(d.id)){ items.push(d); n++; } });
      items.sort((a,b) => (b.created||"").localeCompare(a.created||""));
      save(); refreshChrome(); renderList(); toast("Added " + n + " phrase" + (n===1?"":"s"));
    } catch(err){ toast("That file didn't look right"); }
    e.target.value = "";
  };
  r.readAsText(f);
};

/* ---------- offline ---------- */
/* Relative path, never "/sw.js" — served from a subpath on GitHub Pages, so
   an absolute path resolves off the site entirely. file:// has no service
   workers at all, hence the protocol guard. */
if ("serviceWorker" in navigator && location.protocol !== "file:"){
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
/* Asks the browser to treat this origin's storage as durable. Safari grants
   or refuses it silently based on how much the site has been used, so it is
   a hint rather than a guarantee — Back up is still the real safety net. */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ---------- boot ---------- */
refreshChrome(); refreshBackupHint();
if (dueNow().length && items.length > 3) go("review"); else go("add");

/* expose for tests */
window.__pb = { get items(){return items}, dueNow, plusDays, today, grade:(k)=>grade(k) };
})();
</script>
</body>
</html>
