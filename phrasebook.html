<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- "default", not "black-translucent": the light theme needs dark status-bar
     text, and black-translucent draws it white. The cost is that content no
     longer runs under the status bar. How "default" looks in dark mode on a
     real iPhone is unverified; see CLAUDE.md. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eee9e0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)">
<!-- All relative: this is served from a subpath (/Eng-Phrases/) on GitHub
     Pages, so anything absolute would resolve off the site. iOS gives
     apple-touch-icon priority over the manifest's icons, and applies its own
     rounded mask, so that PNG is deliberately square and full-bleed. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<title>Phrasebook</title>
<style>
  /* Light by day, dark by night: the palette follows the phone's appearance
     setting, so with Appearance on Automatic the bedtime review is dark.
     Flat fills and 1px borders only: no shadows, no gradients. */
  :root{
    color-scheme:light dark;
    --bg:#eee9e0; --surface:#faf8f4; --surface2:#e5dfd4; --line:#ddd5c8;
    --text:#1c1a17; --text2:#3d3933; --muted:#6b645a;
    --good:#2f7a4f; --good-line:#b9d4c2;
    --warn:#9a5716; --warn-line:#e2c9a8;
    --danger:#a63d2b;
    --on-text:#faf8f4; --badge:#a85f15; --on-badge:#ffffff;
    --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --r:16px; --R:22px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#161412; --surface:#211e1b; --surface2:#2d2925; --line:#36312b;
      --text:#eee8dd; --text2:#d2cabd; --muted:#9c9488;
      --good:#79c495; --good-line:#2f5a40;
      --warn:#e3a35a; --warn-line:#5e4322;
      --danger:#ec8f7e;
      --on-text:#161412; --badge:#e3a35a; --on-badge:#1d1206;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg)}
  body{
    color:var(--text);font:16px/1.5 var(--sans);
    display:flex;flex-direction:column;-webkit-text-size-adjust:100%;
    /* No bottom safe-area inset here: nav is the last flex child and reserves
       it itself, so having it on both left a dead strip under the nav bar in
       standalone mode. overflow-wrap inherits, so one rule keeps a long
       unbroken phrase from pushing the card sideways. */
    overflow-wrap:break-word;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;border-radius:var(--r);touch-action:manipulation}
  button:focus-visible,.flash:focus-visible{outline:2px solid var(--text);outline-offset:2px}

  main{
    flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:flex;flex-direction:column;
    padding:calc(12px + env(safe-area-inset-top)) 20px 24px;
  }
  .panel{display:none}
  .panel.on{display:block}

  /* One quiet row at the top of each screen: what this screen is for, and
     at most one action. */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin-bottom:18px}
  .lead{display:flex;align-items:center;gap:14px;min-width:0}
  .label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .count{font-size:13px;color:var(--muted)}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .primary{min-height:44px;padding:0 22px;border-radius:999px;background:var(--text);color:var(--on-text);font-weight:600;font-size:16px}
  .link{min-height:44px;padding:0 2px;color:var(--muted);font-size:16px}
  .primary:active,.btn:active,.link:active{opacity:.7}
  .small{min-height:44px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600}
  .small:active{opacity:.7}
  .small:disabled{opacity:.55}

  /* ---------- add ---------- */
  .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--R)}
  .box:focus-within{border-color:var(--muted)}
  textarea,input{
    display:block;width:100%;margin:0;border:none;background:none;color:var(--text);
    font:inherit;font-size:16px;outline:none;resize:none;-webkit-appearance:none;appearance:none;
  }
  textarea{overflow:hidden}
  ::placeholder{color:var(--muted);opacity:.75}
  .phrase{padding:22px 20px 26px;min-height:140px}
  #f-phrase{font:600 26px/1.3 var(--serif);letter-spacing:-.01em}
  .fields{margin-top:14px}
  .fields .row{padding:14px 20px 16px}
  .fields .row+.row{border-top:1px solid var(--line)}
  .fields label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .fields textarea{font-size:17px;line-height:1.45}
  .hint{font-size:13px;color:var(--muted);margin:14px 4px 0}

  /* Shown at the top so it isn't hidden behind the keyboard. */
  .toast{
    position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));
    transform:translate(-50%,-6px);background:var(--text);color:var(--on-text);
    padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- words ---------- */
  .search{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:12px 18px;margin-bottom:22px}
  .search:focus{border-color:var(--muted)}
  .group{background:var(--surface);border:1px solid var(--line);border-radius:var(--R);overflow:hidden}
  .card{padding:16px 20px;cursor:pointer}
  .card+.card{border-top:1px solid var(--line)}
  .card:not(.open):active{background:var(--surface2)}
  .card.open{cursor:default}
  .card .top{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
  .card .p{font:600 19px/1.3 var(--serif);min-width:0}
  .card .m{color:var(--text2);font-size:15px;margin-top:4px}
  .card:not(.open) .m{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .s{font:italic 15px/1.45 var(--serif);color:var(--muted);margin-top:10px}
  .pill{flex:none;font-size:12px;color:var(--muted);white-space:nowrap}
  .pill.due{color:var(--warn)}
  .pill.known{color:var(--good)}
  .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:12px}
  .acts{display:flex;gap:6px;margin-top:14px}
  .acts button{flex:1;min-height:44px;padding:0 4px;background:var(--surface2);border-radius:12px;color:var(--text);font-size:13px;font-weight:500;white-space:nowrap}
  .acts button:active{opacity:.7}
  .acts .del{color:var(--danger)}

  .empty{text-align:center;color:var(--muted);padding:56px 24px;font-size:15px}
  .empty b{display:block;color:var(--text);font:600 22px/1.3 var(--serif);margin-bottom:8px}

  .backup{margin-top:44px}
  .backup .label{display:block;margin:0 4px 6px}
  .backup .hint{margin:0 4px 14px}
  .two{display:flex;gap:10px}
  .two>*{flex:1}
  .btn{display:block;width:100%;min-height:50px;padding:0 16px;border-radius:var(--r);font-weight:600;font-size:16px}
  .btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--text)}

  /* ---------- review ---------- */
  /* One card fills the screen. The answers sit at the bottom, under the thumb. */
  #p-review.on{display:flex;flex-direction:column;flex:1}
  #review-body{flex:1;display:flex;flex-direction:column}
  .rtop{display:flex;align-items:center;gap:14px;min-height:44px;margin-bottom:14px}
  .prog{flex:1;height:3px;background:var(--surface2);border-radius:9px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--text);width:0;transition:width .3s}
  .flash{
    flex:1;min-height:300px;background:var(--surface);border:1px solid var(--line);border-radius:26px;
    padding:0 26px 26px;display:flex;flex-direction:column;text-align:center;cursor:pointer;
  }
  /* The phrase sits a fixed distance from the top of the card, so it stays
     put when the answer appears beneath it. */
  .flash::before{content:"";flex:none;height:clamp(48px,14vh,120px)}
  .flash .q{font:600 30px/1.25 var(--serif);letter-spacing:-.01em}
  .flash .q.long{font-size:24px}
  .flash .tap{color:var(--muted);font-size:13px;margin-top:22px}
  .flash .a{margin-top:24px;padding-top:22px;border-top:1px solid var(--line);animation:fade .2s ease-out}
  .flash .a .m{font-size:18px;line-height:1.5;color:var(--text2)}
  .flash .a .s{font:italic 16px/1.5 var(--serif);color:var(--muted);margin-top:14px}
  .none{color:var(--muted)}
  /* The empty spacer holds the buttons' place before the reveal, so the card
     doesn't change size when they appear. */
  .grade,.grade-space{flex:none;display:flex;gap:10px;margin-top:14px;min-height:58px}
  .grade button{flex:1;min-height:58px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:16px}
  .grade button:active{background:var(--surface2)}
  .grade .no{color:var(--warn);border-color:var(--warn-line)}
  .grade .yes{color:var(--good);border-color:var(--good-line)}
  .done{margin:auto 0;padding:24px 0}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* ---------- tab bar ---------- */
  nav{
    flex:none;display:flex;gap:4px;padding:5px;
    margin:0 16px calc(10px + env(safe-area-inset-bottom));
    background:var(--surface);border:1px solid var(--line);border-radius:26px;
  }
  nav button{
    position:relative;flex:1;min-height:54px;border-radius:21px;color:var(--muted);
    font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  nav button.on{background:var(--surface2);color:var(--text)}
  nav .badge{
    position:absolute;top:6px;left:50%;margin-left:7px;background:var(--badge);color:var(--on-badge);
    font-size:10px;font-weight:700;line-height:16px;min-width:16px;padding:0 5px;border-radius:999px;
  }

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main>
  <!-- ADD -->
  <section id="p-add" class="panel on">
    <div class="bar">
      <div class="lead">
        <button class="link" id="cancel" hidden>Cancel</button>
        <span class="label" id="add-label">New phrase</span>
      </div>
      <button class="primary" id="save">Save</button>
    </div>
    <div class="box phrase">
      <label for="f-phrase" class="vh">Phrase, word or slang</label>
      <textarea id="f-phrase" rows="1" autocomplete="off" autocapitalize="none" enterkeyhint="next" placeholder="What did you hear?"></textarea>
    </div>
    <div class="box fields">
      <div class="row">
        <label for="f-meaning">What it means</label>
        <textarea id="f-meaning" rows="1" placeholder="In your own words"></textarea>
      </div>
      <div class="row">
        <label for="f-source">Where I heard it</label>
        <textarea id="f-source" rows="1" placeholder="e.g. Sam said it on the standup call"></textarea>
      </div>
    </div>
    <p class="hint">The context is what makes it stick. Even 5 words helps.</p>
  </section>

  <!-- WORDS -->
  <section id="p-words" class="panel">
    <div class="bar">
      <span class="label">Your phrases</span>
      <div class="lead">
        <span class="count" id="stat"></span>
        <button class="small" id="syncbtn" hidden>Sync</button>
      </div>
    </div>
    <input id="search" class="search" placeholder="Search phrases, meanings, context" autocomplete="off" autocapitalize="none" enterkeyhint="search" aria-label="Search">
    <div id="list"></div>
    <div class="backup">
      <span class="label">Sync</span>
      <p class="hint" id="sync-hint"></p>
      <div id="sync-setup" hidden>
        <input id="sync-key" class="search" placeholder="Paste your access key" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Access key">
      </div>
      <div class="two">
        <button class="btn ghost" id="sync-a"></button>
        <button class="btn ghost" id="sync-b" hidden>Cancel</button>
      </div>
    </div>
    <div class="backup">
      <span class="label">Backup</span>
      <p class="hint" id="backup-hint">Everything is stored on this device only.</p>
      <div class="two">
        <button class="btn ghost" id="export">Back up</button>
        <button class="btn ghost" id="importbtn">Restore</button>
      </div>
    </div>
    <input type="file" id="importfile" accept=".json" hidden>
  </section>

  <!-- REVIEW -->
  <section id="p-review" class="panel">
    <div id="review-body"></div>
  </section>
</main>

<nav>
  <button data-tab="add" class="on">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add</button>
  <button data-tab="words">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Words</button>
  <button data-tab="review">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 10h8M8 14h5"/></svg>Review<span class="badge" id="badge" style="display:none"></span></button>
</nav>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
const KEY = "phrasebook.v1";
const $ = s => document.querySelector(s);

/* ---------- storage ---------- */
let items = [];
try { items = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e){ items = []; }
/* Deleted ids, each with when it was deleted, so a sync doesn't bring a
   phrase back from the other device. Its own key, so phrasebook.v1 keeps
   its shape. */
const DKEY = "phrasebook.deleted";
let deleted = {};
try { deleted = JSON.parse(localStorage.getItem(DKEY) || "{}") || {}; } catch(e){ deleted = {}; }
/* If the write fails — a full disk, Safari private mode — say so out loud.
   Failing silently here would look exactly like a successful save. */
const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(items)); localStorage.setItem(DKEY, JSON.stringify(deleted)); }
  catch(e){ toast("Couldn't save — storage is full"); }
};
/* Every change stamps the phrase, so sync can tell which copy is newer. */
const touch = it => { it.updated = new Date().toISOString(); };

/* ---------- dates ---------- */
const dayStr = d => { const x = d ? new Date(d) : new Date();
  return x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0"); };
const today = () => dayStr();
const plusDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return dayStr(d); };
const prettyDate = iso => {
  const t = today();
  if (dayStr(iso) === t) return "today";
  if (dayStr(iso) === plusDays(-1)) return "yesterday";
  return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric"});
};

/* ---------- model ---------- */
const dueNow = () => items.filter(i => i.status !== "known" && i.due <= today());
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), 1500);
}

function refreshChrome(){
  const d = dueNow().length;
  $("#stat").textContent = items.length + (items.length===1?" phrase":" phrases");
  const b = $("#badge");
  if (d){ b.textContent = d; b.style.display = ""; } else b.style.display = "none";
}

/* ---------- tabs ---------- */
let tab = "add";
function go(t){
  tab = t;
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-"+t));
  document.querySelectorAll("nav button").forEach(b => {
    const on = b.dataset.tab === t;
    b.classList.toggle("on", on);
    if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  if (t === "words") renderList();
  if (t === "review") startReview();
  if (t === "add"){ growAll(); setTimeout(()=>$("#f-phrase").focus(), 60); }
  window.scrollTo(0,0); document.querySelector("main").scrollTop = 0;
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.tab));

/* ---------- add / edit ---------- */
const fields = ["#f-phrase", "#f-meaning", "#f-source"].map($);
/* Boxes start one line tall and grow with what's typed. A hidden box
   measures 0, so leave its height alone until its tab is showing. */
const grow = t => { t.style.height = "auto"; const h = t.scrollHeight; t.style.height = h ? (h + 2) + "px" : ""; };
const growAll = () => fields.forEach(grow);
fields.forEach(t => t.addEventListener("input", () => grow(t)));

let editingId = null;
function setEditing(id){
  editingId = id;
  $("#save").textContent = id ? "Update" : "Save";
  $("#cancel").hidden = !id;
  $("#add-label").hidden = !!id;
}
$("#save").onclick = () => {
  const phrase = $("#f-phrase").value.trim();
  const meaning = $("#f-meaning").value.trim();
  const source = $("#f-source").value.trim();
  if (!phrase) { $("#f-phrase").focus(); return toast("Add a phrase first"); }

  if (editingId){
    const it = items.find(i => i.id === editingId);
    Object.assign(it, {phrase, meaning, source}); touch(it);
    setEditing(null);
    save(); clearForm(); refreshChrome(); toast("Updated"); go("words"); return;
  }
  const now = new Date().toISOString();
  items.unshift({
    id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
    phrase, meaning, source,
    created: now, updated: now,
    due: today(), status: "new", seen: 0
  });
  save(); clearForm(); refreshChrome(); toast("Saved");
  $("#f-phrase").focus();
};
function clearForm(){ fields.forEach(f => f.value = ""); growAll(); }
$("#cancel").onclick = () => { setEditing(null); clearForm(); go("words"); };
$("#f-phrase").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); $("#f-meaning").focus(); }});

/* ---------- words list ---------- */
let open = null;
function renderList(){
  refreshBackupHint();
  const q = $("#search").value.trim().toLowerCase();
  const rows = items.filter(i => !q ||
    (i.phrase+" "+i.meaning+" "+i.source).toLowerCase().includes(q));

  if (!rows.length){
    $("#list").innerHTML = items.length
      ? `<div class="empty">Nothing matches “${esc(q)}”.</div>`
      : `<div class="empty"><b>No phrases yet</b>Tap Add whenever you hear something new.</div>`;
    return;
  }
  /* Closed, a row is the phrase and one line of meaning. Open, it shows
     everything plus the three actions. */
  $("#list").innerHTML = `<div class="group">` + rows.map(i => {
    const isOpen = open === i.id;
    const pill = i.status === "known"
      ? '<span class="pill known">known</span>'
      : (i.due <= today() ? '<span class="pill due">due</span>' : '<span class="pill">' + prettyDate(i.due) + '</span>');
    return `<div class="card${isOpen ? " open" : ""}" data-id="${i.id}">
      <div class="top"><div class="p">${esc(i.phrase)}</div>${pill}</div>
      ${i.meaning ? `<div class="m">${esc(i.meaning)}</div>` : ""}
      ${isOpen ? `
        ${i.source ? `<div class="s">“${esc(i.source)}”</div>` : ""}
        <div class="meta"><span>added ${prettyDate(i.created)}</span>${i.seen ? `<span>seen ${i.seen}×</span>` : ""}</div>
        <div class="acts">
          <button data-a="edit">Edit</button>
          <button data-a="reset">Review again</button>
          <button data-a="del" class="del">Delete</button>
        </div>` : ""}
    </div>`;
  }).join("") + `</div>`;

  $("#list").querySelectorAll(".card").forEach(el => {
    el.onclick = e => {
      const a = e.target.dataset.a, id = el.dataset.id;
      if (!a){ open = (open === id ? null : id); return renderList(); }
      const it = items.find(x => x.id === id);
      if (a === "edit"){
        setEditing(id);
        $("#f-phrase").value = it.phrase; $("#f-meaning").value = it.meaning; $("#f-source").value = it.source;
        go("add");
      } else if (a === "reset"){
        it.status = "learning"; it.due = today(); touch(it); save(); open = null;
        refreshChrome(); renderList(); toast("Back in tonight's deck");
      } else if (a === "del"){
        if (!confirm("Delete “" + it.phrase + "”?")) return;
        deleted[id] = new Date().toISOString();
        items = items.filter(x => x.id !== id); save(); open = null;
        refreshChrome(); renderList(); toast("Deleted");
      }
    };
  });
}
$("#search").oninput = () => { open = null; renderList(); };

/* ---------- review ---------- */
let deck = [], pos = 0, flipped = false, practiceAll = false;

function startReview(){ deck = shuffle(dueNow()); pos = 0; flipped = false; practiceAll = false; renderReview(); }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function renderReview(){
  const box = $("#review-body");
  if (!items.length){
    box.innerHTML = `<div class="done"><div class="empty"><b>Nothing to review</b>Add a few phrases during the day and they'll show up here tonight.</div></div>`;
    return;
  }
  if (pos >= deck.length){
    const known = items.filter(i => i.status === "known").length;
    box.innerHTML = `<div class="done">
        <div class="empty">
          <b>${deck.length ? "Done for tonight" : "Nothing due tonight"}</b>
          ${known} of ${items.length} marked known.
        </div>
        <button class="btn ghost" id="all">Practice all ${items.length} anyway</button>
      </div>`;
    $("#all").onclick = () => { deck = shuffle(items); pos = 0; flipped = false; practiceAll = true; renderReview(); };
    return;
  }
  const it = deck[pos];
  box.innerHTML = `
    <div class="rtop">
      <div class="prog"><i style="width:${(pos/deck.length)*100}%"></i></div>
      <span class="count">${pos+1} of ${deck.length}${practiceAll?" · practice":""}</span>
    </div>
    <div class="flash" id="flash" role="button" tabindex="0">
      <div class="q${it.phrase.length > 60 ? " long" : ""}">${esc(it.phrase)}</div>
      ${flipped ? `<div class="a">
          <div class="m">${esc(it.meaning) || "<span class='none'>no meaning saved</span>"}</div>
          ${it.source ? `<div class="s">“${esc(it.source)}”</div>` : ""}
        </div>` : `<div class="tap">Tap to reveal</div>`}
    </div>
    ${flipped ? `<div class="grade">
        <button class="no" id="g-no">Didn't know</button>
        <button class="yes" id="g-yes">Knew it</button>
      </div>` : `<div class="grade-space"></div>`}`;

  const f = $("#flash");
  f.onclick = () => { if (!flipped){ flipped = true; renderReview(); } };
  f.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); f.click(); } };
  if (flipped){
    $("#g-no").onclick  = () => grade(false);
    $("#g-yes").onclick = () => grade(true);
  }
}
function grade(knew){
  const it = deck[pos];
  it.seen = (it.seen || 0) + 1;
  if (knew){ it.status = "known"; it.due = plusDays(30); }
  else { it.status = "learning"; it.due = plusDays(1); }
  touch(it); save(); refreshChrome();
  pos++; flipped = false; renderReview();
}

/* ---------- backup ---------- */
/* Kept under its own key so the phrasebook.v1 array keeps its shape. */
const BKEY = "phrasebook.backup";

/* Day index from a "YYYY-MM-DD" string. Built from the parts rather than
   new Date(s), which would parse as UTC midnight and be a day out here. */
const dayNum = s => { const p = String(s).split("-").map(Number);
  return Date.UTC(p[0], p[1]-1, p[2]) / 86400000; };

function refreshBackupHint(){
  const el = $("#backup-hint"), last = localStorage.getItem(BKEY);
  if (!items.length){ el.textContent = "Everything is stored on this device only."; el.style.color = ""; return; }
  if (!last){
    el.textContent = "Never backed up. Everything is stored on this device only.";
    el.style.color = "var(--warn)"; return;
  }
  const n = dayNum(today()) - dayNum(last);
  el.textContent = n <= 0 ? "Backed up today."
    : n === 1 ? "Last backed up yesterday."
    : "Last backed up " + n + " days ago.";
  el.style.color = n >= 14 ? "var(--warn)" : "";
}

$("#export").onclick = () => {
  const blob = new Blob([JSON.stringify(items,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "phrasebook-" + today() + ".json";
  a.click(); URL.revokeObjectURL(a.href);
  localStorage.setItem(BKEY, today()); refreshBackupHint(); toast("Backed up");
};
$("#importbtn").onclick = () => $("#importfile").click();
$("#importfile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data)) throw 0;
      const have = new Set(items.map(i => i.id));
      let n = 0;
      data.forEach(d => { if (d && d.phrase && !have.has(d.id)){ items.push(d); n++; } });
      items.sort((a,b) => (b.created||"").localeCompare(a.created||""));
      save(); refreshChrome(); renderList(); toast("Added " + n + " phrase" + (n===1?"":"s"));
    } catch(err){ toast("That file didn't look right"); }
    e.target.value = "";
  };
  r.readAsText(f);
};

/* ---------- sync ---------- */
/* Optional. Phrases are copied to one JSON file in a private GitHub repo so
   the iPhone and the laptop can share them. The access key is pasted once per
   device and kept only in that device's localStorage, never in this file,
   which is public. For each phrase, the copy changed most recently wins;
   deleted phrases stay deleted. The service worker ignores other origins,
   so these requests always go to the network. */
const SKEY = "phrasebook.sync";
const SYNC_URL = "https://api.github.com/repos/afillioapp/phrasebook-data/contents/phrases.json";
const syncCfg = () => { try { return JSON.parse(localStorage.getItem(SKEY) || "{}") || {}; } catch(e){ return {}; } };
const setSyncCfg = c => { try { localStorage.setItem(SKEY, JSON.stringify(c)); } catch(e){} };
/* UTF-8-safe base64, because phrases hold accents and curly quotes. */
const toB64 = s => btoa(unescape(encodeURIComponent(s)));
const fromB64 = s => decodeURIComponent(escape(atob(s.replace(/\s/g, ""))));
const stamp = i => i.updated || i.created || "";

function merge(localItems, localDel, remote){
  const del = Object.assign({}, remote.deleted || {});
  Object.keys(localDel).forEach(id => { if (!del[id] || localDel[id] > del[id]) del[id] = localDel[id]; });
  const byId = new Map();
  (remote.items || []).concat(localItems).forEach(it => {
    if (!it || !it.id || !it.phrase) return;
    const cur = byId.get(it.id);
    if (!cur || stamp(it) > stamp(cur)) byId.set(it.id, it);
  });
  /* A deletion beats any copy older than it; a later edit brings it back. */
  const out = [...byId.values()].filter(it => !(del[it.id] && del[it.id] >= stamp(it)));
  out.sort((a,b) => (b.created||"").localeCompare(a.created||""));
  return { items: out, deleted: del };
}

let syncing = false, setupOpen = false;
async function syncNow(){
  const cfg = syncCfg();
  if (!cfg.token || syncing) return;
  syncing = true; refreshSyncUI();
  const H = { "Authorization": "Bearer " + cfg.token, "Accept": "application/vnd.github+json" };
  try {
    for (let attempt = 0; ; attempt++){
      const r = await fetch(SYNC_URL, { headers: H, cache: "no-store" });
      let remote = { items: [], deleted: {} }, sha;
      if (r.ok){ const j = await r.json(); sha = j.sha; remote = JSON.parse(fromB64(j.content)); }
      else if (r.status !== 404) throw r.status;   /* 404: first sync, no file yet */
      const m = merge(items, deleted, remote);
      items = m.items; deleted = m.deleted; save();
      const same = JSON.stringify(m) === JSON.stringify(merge(remote.items || [], remote.deleted || {}, {}));
      if (sha && same) break;                       /* nothing new to send */
      const p = await fetch(SYNC_URL, {
        method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, H),
        body: JSON.stringify({
          message: "Sync from " + (/iPhone|iPad/.test(navigator.userAgent) ? "iPhone" : "laptop"),
          content: toB64(JSON.stringify({ version: 1, items: m.items, deleted: m.deleted }, null, 1)),
          sha
        })
      });
      /* 409 or 422: the other device synced in between. Start again from its copy. */
      if ((p.status === 409 || p.status === 422) && attempt < 2) continue;
      if (!p.ok) throw p.status;
      break;
    }
    setSyncCfg(Object.assign(syncCfg(), { last: new Date().toISOString() }));
    refreshChrome(); toast("Synced");
  } catch(e){
    toast(e === 401 ? "Access key not accepted — it may have expired"
      : (e === 403 || e === 404) ? "This key can't open the phrasebook-data repo"
      : typeof e === "number" ? "Sync failed (error " + e + ")"
      : e instanceof SyntaxError ? "The synced file didn't look right"
      : "Couldn't reach GitHub — check your connection");
  } finally {
    syncing = false; refreshSyncUI();
    if (tab === "words") renderList();
  }
}

function refreshSyncUI(){
  const cfg = syncCfg(), on = !!cfg.token, b = $("#syncbtn");
  b.hidden = !on; b.disabled = syncing; b.textContent = syncing ? "Syncing…" : "Sync";
  $("#sync-setup").hidden = !setupOpen;
  $("#sync-b").hidden = !setupOpen;
  $("#sync-hint").textContent = on
    ? (cfg.last ? "Last synced " + new Date(cfg.last).toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}) + "."
                : "Not synced on this device yet.")
    : setupOpen ? "Paste the access key you made on GitHub."
    : "Keep your iPhone and laptop in step through your private GitHub repo.";
  $("#sync-a").textContent = on ? "Remove key" : setupOpen ? "Save key" : "Set up sync";
}
$("#syncbtn").onclick = () => syncNow();
$("#sync-a").onclick = () => {
  if (syncCfg().token){
    if (!confirm("Turn off sync on this device? Your phrases stay here.")) return;
    try { localStorage.removeItem(SKEY); } catch(e){}
    refreshSyncUI(); return toast("Sync turned off on this device");
  }
  if (!setupOpen){ setupOpen = true; refreshSyncUI(); return $("#sync-key").focus(); }
  const key = $("#sync-key").value.trim();
  if (!key){ $("#sync-key").focus(); return toast("Paste the key first"); }
  setSyncCfg({ token: key }); $("#sync-key").value = ""; setupOpen = false;
  refreshSyncUI(); syncNow();
};
$("#sync-b").onclick = () => { setupOpen = false; $("#sync-key").value = ""; refreshSyncUI(); };

/* ---------- offline ---------- */
/* Relative path, never "/sw.js" — served from a subpath on GitHub Pages, so
   an absolute path resolves off the site entirely. file:// has no service
   workers at all, hence the protocol guard. */
if ("serviceWorker" in navigator && location.protocol !== "file:"){
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
/* Asks the browser to treat this origin's storage as durable. Safari grants
   or refuses it silently based on how much the site has been used, so it is
   a hint rather than a guarantee — Back up is still the real safety net. */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* iOS only shows :active pressed states once a touch listener exists. */
document.addEventListener("touchstart", () => {}, {passive:true});

/* ---------- boot ---------- */
refreshChrome(); refreshBackupHint(); refreshSyncUI();
if (dueNow().length && items.length > 3) go("review"); else go("add");

/* expose for tests */
window.__pb = { get items(){return items}, get deleted(){return deleted}, dueNow, plusDays, today,
  grade:(k)=>grade(k), merge, syncNow };
})();
</script>
